<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำนวณค่าขนส่งด้วยวิธี Vogel (VAM)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#17262f;--mute:#5b6b75;--line:#cfd9df;--acc:#0f6e6e;--accfg:#fff;--hi:#f2b33d;--hifg:#3a2a00;--pen:#b4430c;--dead:#e4eaee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b21;--panel:#172830;--ink:#e6eef2;--mute:#97aab4;--line:#2c434e;--acc:#4fc3c3;--accfg:#06262b;--hi:#e0a62e;--hifg:#1e1500;--pen:#ff9a62;--dead:#1f343d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b21;--panel:#172830;--ink:#e6eef2;--mute:#97aab4;--line:#2c434e;--acc:#4fc3c3;--accfg:#06262b;--hi:#e0a62e;--hifg:#1e1500;--pen:#ff9a62;--dead:#1f343d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Sarabun",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 4px;font-weight:700}
h2{font-size:1.2rem;margin:0 0 12px;font-weight:700}
p.lead{color:var(--mute);margin:0 0 18px;max-width:64ch}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.sc{overflow-x:auto}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:center;min-width:64px;font-weight:400}
th{background:var(--bg);font-weight:600}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;min-width:56px;text-align:center}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:6px;padding:5px 12px}
button.p{background:var(--acc);color:var(--accfg)}
button:disabled{opacity:.4;cursor:default}
button.x{border:0;padding:0 4px;color:var(--mute);min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.note{background:var(--bg);border-left:4px solid var(--acc);padding:8px 12px;margin:0 0 12px;border-radius:4px}
td.dead{background:var(--dead);color:var(--mute);text-decoration:line-through}
td.hi{background:var(--hi);color:var(--hifg);font-weight:700}
td.pn{color:var(--pen);font-weight:600}
td.pn.top{background:var(--pen);color:var(--panel)}
td.gc{padding:0;min-width:92px;height:72px;position:relative}
.cb{position:absolute;top:0;right:0;min-width:34px;padding:1px 8px 3px 10px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;line-height:1.35}
td.dead .cb{background:var(--dead);color:var(--mute);text-decoration:line-through}
td.hi .cb{background:var(--panel);color:var(--ink);border-color:var(--hifg)}
.al{position:absolute;left:8px;bottom:6px;min-width:34px;height:34px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--acc);border-radius:50%;color:var(--acc);font-weight:700;font-size:1rem;line-height:1}
td.hi .al{border-color:var(--hifg);color:var(--hifg)}
td.gc.dead.empty::after{content:"–";position:absolute;left:14px;bottom:10px;color:var(--mute)}
.tot{font-size:1.9rem;font-weight:700;color:var(--acc)}
.fm{color:var(--mute);overflow-wrap:anywhere}
input[type=range]{accent-color:var(--acc);width:min(320px,100%);padding:0}

@media(max-width:640px){
main{padding:12px 8px 40px}
h1{font-size:1.35rem}
section{padding:10px 8px}
.sc table{width:100%}
td,th{min-width:0;padding:2px 3px;font-size:.78rem;line-height:1.25;overflow-wrap:anywhere}
th{font-size:.72rem}
input{min-width:0;padding:3px 2px;font-size:.85rem}
input[type=number]{-moz-appearance:textfield}
button.x{padding:0 2px}
td.gc{min-width:42px;height:58px}
#ed tr:not(:first-child)>th:first-child{white-space:nowrap;min-width:78px}
#ed tr:not(:first-child)>th:first-child input{width:calc(100% - 16px);display:inline-block;vertical-align:middle;padding:3px 1px}
#ed tr:first-child th input{width:100%;padding:3px 1px}
#gr tr:first-child th:last-child,#gr tr:first-child th:nth-last-child(2){font-size:.62rem;overflow-wrap:normal}
#gr th:first-child{min-width:64px}
.cb{min-width:22px;padding:0 4px 2px 5px;font-size:.8rem}
.al{left:3px;bottom:4px;min-width:28px;height:28px;padding:0 3px;font-size:.85rem;border-width:2px}
td.gc.dead.empty::after{left:9px;bottom:8px}
.tot{font-size:1.6rem}
.bar{gap:6px}
}
@media(max-width:360px){
main{padding:10px 4px 32px}
section{padding:8px 5px}
td,th{padding:2px 1px}
input{font-size:.78rem;padding:3px 0}
#ed tr:not(:first-child)>th:first-child{min-width:64px}
#ed th input{font-size:.7rem}
#gr th:first-child{min-width:52px}
td.gc{min-width:36px}
.al{min-width:26px;height:26px;font-size:.78rem}
}
</style>
</head>
<body>
<main>
<h1>คำนวณค่าขนส่งด้วยวิธี Vogel</h1>
<p class="lead">แก้ตัวเลขในตารางได้ทันที ระบบจะคำนวณใหม่และแสดงทุกขั้นตอนของ Vogel’s Approximation Method (VAM) พร้อมต้นทุนรวม</p>

<section>
<h2>1. ข้อมูลนำเข้า</h2>
<div class="sc" id="ed"></div>
<div class="bar"><button id="aS">+ ต้นทาง</button><button id="aD">+ ปลายทาง</button><button id="rs">ล้างค่าเป็น 0</button></div>
</section>

<section>
<h2>2. ขั้นตอนการคำนวณ</h2>
<div id="nt"></div>
<div class="bar"><button id="pv">ก่อนหน้า</button><input type="range" id="sl" min="0" value="0"><button id="nx" class="p">ถัดไป</button><span id="sn"></span></div>
<p id="ex"></p>
<div class="sc" id="gr"></div>
</section>

<section>
<h2>3. ผลลัพธ์</h2>
<div class="sc" id="rt"></div>
<p>ต้นทุนรวมต่ำสุดที่ได้จาก VAM</p>
<div class="tot" id="tt"></div>
<div class="fm" id="fm"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const demo=()=>({src:[{n:'โรงงาน A',v:20},{n:'โรงงาน B',v:30},{n:'โรงงาน C',v:25}],dst:[{n:'คลัง 1',v:10},{n:'คลัง 2',v:25},{n:'คลัง 3',v:15},{n:'คลัง 4',v:25}],c:[[8,6,10,9],[9,12,13,7],[14,9,16,5]]});
let S=demo(),cur=0,R=null;
const rd=x=>Math.round(x*1e6)/1e6, esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function editor(){
  let h='<table><tr><th></th>';
  S.dst.forEach((d,j)=>h+=`<th><input data-k="dn" data-j="${j}" value="${esc(d.n)}" aria-label="ชื่อปลายทาง"><button class="x" data-rd="${j}" title="ลบปลายทาง" aria-label="ลบปลายทาง">×</button></th>`);
  h+='<th>อุปทาน</th></tr>';
  S.src.forEach((s,i)=>{
    h+=`<tr><th><input data-k="sn" data-i="${i}" value="${esc(s.n)}" aria-label="ชื่อต้นทาง"><button class="x" data-rs="${i}" title="ลบต้นทาง" aria-label="ลบต้นทาง">×</button></th>`;
    S.dst.forEach((d,j)=>h+=`<td><input type="number" min="0" step="any" data-k="c" data-i="${i}" data-j="${j}" value="${S.c[i][j]}" aria-label="ต้นทุนขนส่ง"></td>`);
    h+=`<td><input type="number" min="0" step="any" data-k="sv" data-i="${i}" value="${s.v}" aria-label="อุปทาน"></td></tr>`;
  });
  h+='<tr><th>ความต้องการ</th>';
  S.dst.forEach((d,j)=>h+=`<td><input type="number" min="0" step="any" data-k="dv" data-j="${j}" value="${d.v}" aria-label="ความต้องการ"></td>`);
  $('#ed').innerHTML=h+'<td></td></tr></table>';
}

function solve(){
  let src=S.src.map(x=>({n:x.n||'-',v:+x.v||0})),dst=S.dst.map(x=>({n:x.n||'-',v:+x.v||0})),c=S.c.map(r=>r.map(x=>+x||0));
  const ts=src.reduce((a,x)=>a+x.v,0),td=dst.reduce((a,x)=>a+x.v,0);let note='';
  if(ts>td){dst.push({n:'ปลายทางสมมติ',v:rd(ts-td)});c.forEach(r=>r.push(0));note=`อุปทานรวม ${ts} มากกว่าความต้องการรวม ${td} จึงเพิ่มปลายทางสมมติรับส่วนเกิน ${rd(ts-td)} หน่วย (ต้นทุน 0)`}
  else if(td>ts){src.push({n:'ต้นทางสมมติ',v:rd(td-ts)});c.push(dst.map(()=>0));note=`ความต้องการรวม ${td} มากกว่าอุปทานรวม ${ts} จึงเพิ่มต้นทางสมมติเติมส่วนขาด ${rd(td-ts)} หน่วย (ต้นทุน 0)`}
  else note=`อุปทานรวมเท่ากับความต้องการรวม (${ts} หน่วย) ตารางสมดุลแล้ว`;
  const m=src.length,n=dst.length;
  let s=src.map(x=>x.v),d=dst.map(x=>x.v),ra=Array(m).fill(1),ca=Array(n).fill(1);
  const A=src.map(()=>Array(n).fill(null)),steps=[];
  const pen=a=>{a=a.slice().sort((x,y)=>x-y);return a.length>1?a[1]-a[0]:a[0]};
  while(ra.includes(1)&&ca.includes(1)&&(ts>0||td>0)){
    const ri=[...Array(m).keys()].filter(i=>ra[i]),ci=[...Array(n).keys()].filter(j=>ca[j]);
    const rp=Array(m).fill(null),cp=Array(n).fill(null);
    ri.forEach(i=>rp[i]=pen(ci.map(j=>c[i][j])));
    ci.forEach(j=>cp[j]=pen(ri.map(i=>c[i][j])));
    let b=null;
    const test=k=>{if(!b||k.p>b.p||(k.p===b.p&&k.mc<b.mc))b=k};
    ri.forEach(i=>test({t:'r',i,p:rp[i],mc:Math.min(...ci.map(j=>c[i][j]))}));
    ci.forEach(j=>test({t:'c',j,p:cp[j],mc:Math.min(...ri.map(i=>c[i][j]))}));
    let bi,bj;
    if(b.t==='r'){bi=b.i;bj=ci.reduce((a,j)=>c[bi][j]<c[bi][a]?j:a,ci[0])}
    else{bj=b.j;bi=ri.reduce((a,i)=>c[i][bj]<c[a][bj]?i:a,ri[0])}
    const x=Math.min(s[bi],d[bj]),sb=s.slice(),db=d.slice(),rb=ra.slice(),cb=ca.slice();
    A[bi][bj]=rd((A[bi][bj]||0)+x);s[bi]=rd(s[bi]-x);d[bj]=rd(d[bj]-x);
    let closed;if(s[bi]===0){ra[bi]=0;closed='แถว '+src[bi].n}else{ca[bj]=0;closed='คอลัมน์ '+dst[bj].n}
    steps.push({ra:rb,ca:cb,s:sb,d:db,rp,cp,bi,bj,x,b,closed,A:A.map(r=>r.slice())});
  }
  let total=0;const parts=[];
  A.forEach((r,i)=>r.forEach((v,j)=>{if(v){total+=v*c[i][j];parts.push(`${v}×${c[i][j]}`)}}));
  R={src,dst,c,A,steps,total:rd(total),parts,note};
  cur=Math.min(cur,Math.max(steps.length-1,0));
}

function grid(k){
  const st=R.steps[k],{src,dst,c}=R;let h='<table><tr><th></th>';
  dst.forEach((d,j)=>h+=`<th>${esc(d.n)}</th>`);
  h+='<th>อุปทานคงเหลือ</th><th>Penalty แถว</th></tr>';
  src.forEach((s,i)=>{
    h+=`<tr><th>${esc(s.n)}</th>`;
    dst.forEach((d,j)=>{
      const dead=!st.ra[i]||!st.ca[j],hi=i===st.bi&&j===st.bj,a=st.A[i][j];
      h+=`<td class="gc ${hi?'hi':dead?'dead':''}${a==null?' empty':''}"><span class="cb">${c[i][j]}</span>${a!=null?`<span class="al" title="จำนวนที่จัดสรร">${a}</span>`:''}</td>`;
    });
    const top=st.b.t==='r'&&st.b.i===i;
    h+=`<td>${st.s[i]}</td><td class="pn${top?' top':''}">${st.rp[i]==null?'–':st.rp[i]}</td></tr>`;
  });
  h+='<tr><th>ความต้องการคงเหลือ</th>';
  dst.forEach((d,j)=>h+=`<td>${st.d[j]}</td>`);
  h+='<td></td><td></td></tr><tr><th>Penalty คอลัมน์</th>';
  dst.forEach((d,j)=>{const top=st.b.t==='c'&&st.b.j===j;h+=`<td class="pn${top?' top':''}">${st.cp[j]==null?'–':st.cp[j]}</td>`});
  return h+'<td></td><td></td></tr></table>';
}

function show(){
  const N=R.steps.length;
  $('#nt').innerHTML=`<p class="note">${R.note}</p>`;
  if(!N){$('#gr').innerHTML='';$('#ex').textContent='ยังไม่มีข้อมูลให้คำนวณ กรอกอุปทานและความต้องการก่อน';$('#sn').textContent='';$('#sl').max=0;$('#pv').disabled=$('#nx').disabled=true}
  else{
    const st=R.steps[cur],{src,dst,c}=R,w=st.b.t==='r'?'แถว '+src[st.b.i].n:'คอลัมน์ '+dst[st.b.j].n;
    $('#sl').max=N-1;$('#sl').value=cur;$('#sn').textContent=`ขั้นที่ ${cur+1} จาก ${N}`;
    $('#pv').disabled=cur===0;$('#nx').disabled=cur===N-1;
    $('#ex').innerHTML=`Penalty สูงสุดคือ <b>${st.b.p}</b> ที่${w} จึงเลือกช่องที่ต้นทุนต่ำสุดในเส้นนั้น คือ ${esc(src[st.bi].n)} → ${esc(dst[st.bj].n)} (ต้นทุน ${c[st.bi][st.bj]}) ส่งได้ <b>${st.x}</b> หน่วย แล้วปิด${st.closed}`;
    $('#gr').innerHTML=grid(cur);
  }
  let h='<table><tr><th>จำนวนที่ส่ง</th>';
  R.dst.forEach(d=>h+=`<th>${esc(d.n)}</th>`);h+='</tr>';
  R.src.forEach((s,i)=>{h+=`<tr><th>${esc(s.n)}</th>`;R.dst.forEach((d,j)=>{const a=R.A[i][j];h+=`<td class="${a?'hi':''}">${a||'–'}</td>`});h+='</tr>'});
  $('#rt').innerHTML=h+'</table>';
  $('#tt').textContent=R.total.toLocaleString('th-TH');
  $('#fm').textContent=R.parts.length?R.parts.join(' + ')+' = '+R.total:'';
}
const upd=()=>{solve();show()};

$('#ed').addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k,i=+t.dataset.i,j=+t.dataset.j,v=t.value;
  if(k==='dn')S.dst[j].n=v;else if(k==='sn')S.src[i].n=v;
  else if(k==='c')S.c[i][j]=v;else if(k==='sv')S.src[i].v=v;else if(k==='dv')S.dst[j].v=v;
  upd();
});
$('#ed').addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.rs!==undefined&&S.src.length>1){const i=+t.dataset.rs;S.src.splice(i,1);S.c.splice(i,1)}
  else if(t.dataset.rd!==undefined&&S.dst.length>1){const j=+t.dataset.rd;S.dst.splice(j,1);S.c.forEach(r=>r.splice(j,1))}
  else return;
  cur=0;editor();upd();
});
$('#aS').onclick=()=>{S.src.push({n:'ต้นทาง '+(S.src.length+1),v:0});S.c.push(S.dst.map(()=>0));editor();upd()};
$('#aD').onclick=()=>{S.dst.push({n:'ปลายทาง '+(S.dst.length+1),v:0});S.c.forEach(r=>r.push(0));editor();upd()};
$('#rs').onclick=()=>{S.src.forEach(x=>x.v=0);S.dst.forEach(x=>x.v=0);S.c=S.c.map(r=>r.map(()=>0));cur=0;editor();upd()};
$('#pv').onclick=()=>{cur--;show()};
$('#nx').onclick=()=>{cur++;show()};
$('#sl').oninput=e=>{cur=+e.target.value;show()};
editor();upd();
</script>
</body>
</html>
